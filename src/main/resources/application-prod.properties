# ==============================================
# PRODUCTION PROFILE - Dùng khi deploy lên server
# Chạy bằng: java -jar unipart_backend.jar --spring.profiles.active=prod
# ==============================================

# --- Database (Server) ---
# Thay YOUR_SERVER_IP, YOUR_DB_PASSWORD bằng thông tin thực của server
spring.datasource.url=jdbc:mysql://YOUR_SERVER_IP:3306/UniPartDB?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=YOUR_DB_PASSWORD

# --- VNPay (Server) ---
vnpay.returnUrl=http://YOUR_DOMAIN/home/payment/vnpay-return
vnpay.frontend-success-url=http://YOUR_DOMAIN/payment/success
vnpay.frontend-fail-url=http://YOUR_DOMAIN/payment/fail

# --- Backup (Linux paths) ---
app.backup.dir=/var/backups/unipart/
app.backup.mysqldump.path=/usr/bin/mysqldump
app.backup.mysql.path=/usr/bin/mysql

# --- Logging ---
logging.file.name=/var/log/unipart/unipart.log
