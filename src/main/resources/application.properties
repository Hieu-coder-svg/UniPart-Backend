spring.application.name=unipart_backend
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.signer_key = ${JWT_SIGNER_KEY}

jwt.valid-duration = 3600
jwt.refreshable-duration = 360000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from-name=Unipart

spring.ai.openai.api-key=${GEMINI_API_KEY}

spring.ai.openai.chat.base-url=https://generativelanguage.googleapis.com
spring.ai.openai.chat.completions-path=/v1beta/openai/chat/completions
spring.ai.openai.chat.options.model=gemini-2.5-flash


# Backup configuration - Override via environment variables (BACKUP_DIR, MYSQLDUMP_PATH, MYSQL_PATH)
# Or create application-prod.properties for server deployment
app.backup.dir=${BACKUP_DIR:./backups/}
app.backup.mysqldump.path=${MYSQLDUMP_PATH:C:/Program Files/MySQL/MySQL Server 8.0/bin/mysqldump.exe}
app.backup.mysql.path=${MYSQL_PATH:C:/Program Files/MySQL/MySQL Server 8.0/bin/mysql.exe}

# Log file configuration
logging.file.name=logs/unipart.log

