name: Build and Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Set up Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Build JAR (bỏ qua tests để nhanh hơn)
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4. Copy JAR và Dockerfile lên EC2 server
      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar,Dockerfile"
          target: "/home/${{ secrets.EC2_USER }}/unipart-deploy"
          strip_components: 0

      # 5. SSH vào EC2 để build Docker image và chạy container
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Tạo thư mục backup trên máy chủ
            sudo mkdir -p /var/backups/unipart
            sudo chmod 777 /var/backups/unipart

            # Di chuyển vào thư mục deploy
            cd /home/${{ secrets.EC2_USER }}/unipart-deploy

            # Build Docker image trực tiếp trên EC2
            docker build -t unipart-backend:latest .

            # Dừng và xóa container cũ (nếu đang chạy)
            docker stop backend || true
            docker rm backend || true

            # Chạy container mới
            docker run -d \
              --name backend \
              --restart unless-stopped \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e SPRING_DATASOURCE_URL="${{ secrets.DB_URL }}" \
              -e SPRING_DATASOURCE_USERNAME="${{ secrets.DB_USERNAME }}" \
              -e SPRING_DATASOURCE_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -v /var/backups/unipart:/var/backups/unipart \
              -v /var/log/unipart:/var/log/unipart \
              unipart-backend:latest

            # Xoá file deploy để dọn dẹp không gian đĩa
            rm -rf /home/${{ secrets.EC2_USER }}/unipart-deploy/target

            # Kiểm tra container đã chạy chưa
            docker ps | grep backend
            echo "✅ Deploy backend thành công!"
